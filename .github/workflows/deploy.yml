name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: edwinfred
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/wendo-rms
            docker compose exec api npx prisma migrate deploy
            ./deploy.sh
