name: Deploy to Production

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/fred-edwin/v3-rms-backend

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Build backend
        working-directory: backend
        run: pnpm build

      - name: Run backend tests
        working-directory: backend
        run: pnpm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit layer cache stored in GitHub Actions cache — survives between runs
          # so unchanged layers (node_modules install) are never re-downloaded
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: edwinfred
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Reduced from 30m — server no longer builds anything
          command_timeout: 10m
          script: |
            # Free disk BEFORE pulling: each image is ~200 MB and a full disk failed deploys on 3 Oct 2026.
            # Only unused images older than 3 days go; running containers and volumes are never touched.
            docker image prune -af --filter "until=72h" || true
            docker builder prune -f || true
            df -h / | tail -1
            cd ~/wendo-rms
            bash deploy.sh "${{ needs.build.outputs.image_tag }}"
            # And once more after, so the previous image is not kept longer than needed.
            docker image prune -f || true
            df -h / | tail -1
