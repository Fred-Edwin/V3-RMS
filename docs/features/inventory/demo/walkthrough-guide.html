<title>Inventory Walkthrough Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky section rail on the left, one section at a time on the right; the rail becomes a top bar with a section menu under 960px. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #f3f5f8;
  --ink: #0b1f3a;
  --text: #3d4a5c;
  --muted: #667385;
  --rule: #d5dae1;
  --accent: #1f4e9c;
  --good: #1e6b45;
  --warn: #9a6410;
  --bad: #a32a2a;
  --ink-solid: #0b1f3a;
  --on-ink: #ffffff;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.6 var(--sans); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); font-weight: 600; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, select, textarea { font: inherit; }
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; padding: 44px 28px; background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 30px; overflow-y: auto; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rail h1 { font-size: 20px; line-height: 1.3; margin-top: 6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .label { padding-bottom: 10px; }
.nav a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0 9px 12px; border-left: 2px solid transparent; color: var(--text); text-decoration: none; font-size: 14px; }
.nav a small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav a:hover { color: var(--ink); }
.nav a:focus-visible, .btn:focus-visible, .seg button:focus-visible, .cb:focus-visible, select:focus-visible, textarea:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav a[aria-current="page"] { border-left-color: var(--accent); color: var(--ink); font-weight: 600; }
.nav a[aria-current="page"] small { color: var(--accent); font-weight: 600; }
.sync { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-s="ok"] i { background: var(--good); }
.sync[data-s="warn"] i { background: var(--warn); }
.topbar { display: none; }
main { padding: 64px 72px 96px; display: flex; flex-direction: column; gap: 44px; min-width: 0; }
.head { display: flex; flex-direction: column; gap: 16px; padding-bottom: 28px; border-bottom: 2px solid var(--ink-solid); }
.title-xl { font-size: clamp(28px, 3.6vw, 40px); line-height: 1.2; letter-spacing: -.01em; }
.lede { font-size: 16px; line-height: 1.65; max-width: 70ch; }
.block { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.block h2 { font-size: 22px; line-height: 1.3; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--ink-solid); }
.row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.row b { color: var(--ink); font-weight: 600; }
.bullets { display: flex; flex-direction: column; border-top: 1px solid var(--ink-solid); }
.bullets p { position: relative; padding: 12px 0 12px 20px; border-bottom: 1px solid var(--rule); color: var(--ink); }
.bullets p::before { content: ""; position: absolute; left: 0; top: 21px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.flow > div { display: flex; flex-direction: column; gap: 8px; padding-right: 10px; }
.flow .line { display: flex; flex-direction: row; align-items: center; }
.flow .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink-solid); color: var(--on-ink); font: 600 12px var(--sans); display: grid; place-items: center; flex: none; }
.flow .line i { flex: 1; height: 1px; background: var(--ink-solid); }
.flow b { font-size: 13px; color: var(--ink); font-weight: 600; }
.flow span { font-size: 12px; color: var(--muted); }
.role-head { display: flex; flex-direction: column; gap: 14px; padding-bottom: 26px; border-bottom: 2px solid var(--ink-solid); }
.title-l { font-size: clamp(28px, 3.4vw, 36px); line-height: 1.2; letter-spacing: -.01em; }
.split { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.count { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--rule); }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.screens { display: flex; flex-direction: column; border-top: 2px solid var(--ink-solid); }
.screen { display: grid; grid-template-columns: 22px minmax(0, 200px) minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.screen.current { background: var(--panel); margin: 0 -16px; padding: 16px; }
.screen .name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.screen .name b { color: var(--ink); font-size: 15px; font-weight: 600; }
.screen .path { font-size: 12px; color: var(--muted); }
.screen .what { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text); }
.screen .point { font-size: 13px; color: var(--accent); font-weight: 500; }
.screen.done b, .screen.done .what, .screen.done .point { color: var(--muted); }
.cb { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 1px 0 0; border: 1.5px solid var(--ink-solid); background: var(--bg); cursor: pointer; display: grid; place-items: center; border-radius: 0; }
.cb:checked { background: var(--ink-solid); }
.cb:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--on-ink); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.findings { display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--panel); }
.findings h2 { font-size: 22px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { padding: 9px 16px; background: var(--bg); border: 1px solid var(--rule); color: var(--text); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink-solid); color: var(--on-ink); border-color: var(--ink-solid); font-weight: 600; }
.form { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
select, textarea { background: var(--bg); color: var(--ink); border: 1px solid var(--rule); padding: 11px 12px; font-size: 14px; border-radius: 0; min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 46px; line-height: 1.5; }
.btn { background: var(--ink-solid); color: var(--on-ink); border: 0; padding: 0 22px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 46px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--rule); font-weight: 500; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.item { display: grid; grid-template-columns: 104px 130px minmax(0, 1fr) auto; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: start; font-size: 14px; }
.item .txt { color: var(--ink); overflow-wrap: anywhere; white-space: pre-wrap; }
.item .scr { color: var(--muted); font-size: 13px; }
.item.gone .txt { color: var(--muted); text-decoration: line-through; }
.kind { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; }
.kind i { width: 8px; height: 8px; border-radius: 50%; }
.kind.bug { color: var(--bad); } .kind.bug i { background: var(--bad); }
.kind.correction { color: var(--warn); } .kind.correction i { background: var(--warn); }
.kind.suggestion { color: var(--accent); } .kind.suggestion i { background: var(--accent); }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; padding: 2px 0; }
.empty { font-size: 14px; color: var(--muted); padding: 14px 0; }
.status { font-size: 13px; min-height: 20px; color: var(--muted); }
.status.err { color: var(--bad); }
.group-h { font-family: var(--serif); font-size: 20px; color: var(--ink); font-weight: 600; margin-top: 10px; }
.nav-foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; }
@media (max-width: 960px) {
  .shell { display: block; }
  .rail { display: none; }
  .topbar { display: flex; flex-direction: column; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); }
  .topbar .r1 { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .topbar select { width: auto; max-width: 62%; padding: 8px 10px; }
  main { padding: 24px 16px 72px; gap: 32px; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
  .flow .line i { display: none; }
  .screen { grid-template-columns: 26px minmax(0, 1fr); gap: 12px; }
  .screen .what { grid-column: 2; }
  .screen.current { margin: 0 -16px; }
  .cb { width: 26px; height: 26px; }
  .form { grid-template-columns: minmax(0, 1fr); }
  .btn { min-height: 48px; }
  .item { grid-template-columns: minmax(0, 1fr) auto; }
  .item .kind { grid-column: 1; } .item .scr { grid-column: 1; } .item .txt { grid-column: 1 / -1; }
  .item .act { grid-row: 1; grid-column: 2; }
  .findings { padding: 18px 16px; }
}
</style>

<div class="shell">
  <aside class="rail">
    <div>
      <div class="eyebrow">Walkthrough guide</div>
      <h1>Inventory &amp; Procurement</h1>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sync" id="sync" data-s="idle"><i></i><span id="syncText">Connecting</span></div>
  </aside>
  <div>
    <div class="topbar">
      <div class="r1"><span class="eyebrow">Walkthrough guide</span><select id="jump" aria-label="Jump to section"></select></div>
      <div class="bar"><i id="topBar"></i></div>
    </div>
    <main id="main"></main>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- content ---------------- */
  var ROLES = [
    { id: 'store-manager', name: 'Store Manager', time: 'about 50 minutes', device: 'Laptop',
      summary: 'Owns the catalog and suppliers, buys and receives stock, dispatches to branches and verifies the daily count. Signs each step with a PIN.',
      brief: [
        'Items are set up once here. Every other role reads from this catalog.',
        'A receipt is signed with a PIN, and stock only rises when it is signed.',
        'Dispatch is signed per department, so each department gets its own delivery note.',
        'Ask: which supplier terms and item units match how you buy today?'
      ],
      screens: [
        ['Catalog', 'Sidebar › Catalog', 'All items grouped by category, with search and filters.', 'Every item shows its buy unit and current cost.'],
        ['Manage categories', 'Catalog › Manage categories', 'Add categories and nest them. A new category is available in the item form straight away.', ''],
        ['Add item', 'Catalog › Add item', 'Name, category, buy unit, usage unit, and the conversion between them.', 'The label reads the conversion back, for example 1 bag = 25 kg.'],
        ['Suppliers', 'Sidebar › Suppliers', 'Supplier list with payment terms and what is owed.', 'Balance and days to pay for each supplier.'],
        ['Restock levels', 'Catalog › Restock levels', 'Minimum level per item for each department.', ''],
        ['Purchasing', 'Sidebar › Purchasing › New', 'Plan a purchase from a supplier with suggested quantities.', 'The plan is an estimate, not a commitment.'],
        ['Receiving', 'Sidebar › Receiving', 'Receive against the plan, flag price changes and sign with a PIN.', 'Stock rises only once the receipt is signed.'],
        ['Prep', 'Sidebar › Prep', 'Record a prep run that turns raw items into a prepared one.', 'Yield is compared with recent runs and flagged when it drifts.'],
        ['Dispatch', 'Sidebar › Dispatch', 'Fulfil a branch requisition per department, sign, and print the delivery note.', 'Each department is signed on its own.'],
        ['Stock & counts', 'Sidebar › Stock & counts', 'Stock position, the daily count to verify, spot counts and the stock ledger.', 'The attendant counted blind. Query a line to send it back.'],
        ['Team', 'Sidebar › Settings › Team', 'Add store attendants, reset a password or PIN, and deactivate an account.', 'The Store Manager never sees anyone’s PIN.'],
        ['Signing PIN', 'Settings › My PIN, or the first signature', 'Set the four-digit PIN used to sign every step.', 'The sign sheet asks for a new PIN if none exists.']
      ] },
    { id: 'store-attendant', name: 'Store Attendant', time: 'about 35 minutes', device: 'Phone',
      summary: 'Works the store floor on a phone: receives deliveries, records prep, fulfils dispatches and counts stock without seeing the expected quantity.',
      brief: [
        'The attendant counts blind, so the count is independent of the book quantity.',
        'Purchasing, suppliers and payables are not part of this role.',
        'The first signature asks the attendant to choose a PIN.',
        'Ask: what do you record on paper today that this screen replaces?'
      ],
      screens: [
        ['First sign-in and PIN', 'Sign in › first signature', 'The attendant chooses a four-digit PIN before signing.', 'Only the attendant knows the PIN.'],
        ['Catalog', 'Menu › Catalog', 'A read-only list of items.', ''],
        ['Receiving', 'Menu › Receiving', 'Receive goods against a purchase, enter what arrived and sign.', 'Quantities are typed with the buy unit next to them.'],
        ['Prep', 'Menu › Prep', 'Start a prep run, choose inputs and record the output.', ''],
        ['Dispatch', 'Menu › Dispatch', 'Fulfil a requisition by department and sign.', 'Short lines are flagged before signing.'],
        ['Stock & counts', 'Menu › Stock & counts', 'The hub for counting. It shows item names, not quantities.', 'Quantities are hidden on purpose.'],
        ['Daily count', 'Stock & counts › Daily count', 'Count each item, submit and sign with a PIN.', 'The Store Manager verifies it next.']
      ] },
    { id: 'department-head', name: 'Department Head', time: 'about 35 minutes', device: 'Phone or tablet',
      summary: 'Runs one department at a branch. Asks the store for stock, confirms what arrives, sets restock levels and records waste.',
      brief: [
        'A department head is a staff member marked as head. Their normal role stays the same.',
        'Each requisition has one section per department; a head fills only their own.',
        'Deliveries are confirmed line by line, and any gap becomes a discrepancy.',
        'Ask: how often do you need to order outside the morning round?'
      ],
      screens: [
        ['Requisitions', 'Sidebar › Requisitions', 'Start a morning, afternoon, evening or ad-hoc requisition.', 'Requisitions that were never submitted can be cancelled.'],
        ['Fill a section', 'Requisitions › open one', 'Add lines by category, note anything for the manager, and submit with a PIN.', 'Tapping an item twice makes two lines. The stepper changes one line’s quantity.'],
        ['Deliveries', 'Branch › Deliveries', 'Confirm what arrived from the store.', 'A difference is recorded as a discrepancy, not edited away.'],
        ['Restock levels', 'Restock levels page', 'Set minimums for the department’s items.', ''],
        ['Log waste', 'Requisitions › Log waste', 'Record wasted stock with a reason.', 'Waste reduces stock through the ledger.'],
        ['Stock ledger', 'Requisitions › Ledger', 'Every movement for the department’s items, with a running balance.', ''],
        ['Signing PIN', 'First submit, or Profile', 'Choose the PIN used to sign requisitions.', '']
      ] },
    { id: 'branch-manager', name: 'Branch Manager', time: 'about 25 minutes', device: 'Laptop',
      summary: 'Reviews what departments ask for, edits or returns sections, signs the approval, and confirms deliveries on behalf of departments.',
      brief: [
        'Nothing reaches the store until the Branch Manager approves.',
        'A section can be returned to its head with a note instead of being edited.',
        'The approval is signed with a PIN and cannot be changed afterwards.',
        'Ask: who approves when you are away?'
      ],
      screens: [
        ['Requisitions', 'Branch › Requisitions', 'Requisitions waiting for approval, one department section at a time.', 'Sections are grouped by department.'],
        ['Review and approve', 'Requisitions › open one', 'Edit a line with a reason, return a section, or fill it yourself, then sign.', 'Every edit keeps its reason.'],
        ['History', 'Requisitions › History', 'Approved requisitions with who signed and when.', ''],
        ['Deliveries', 'Branch › Deliveries', 'Confirm receipt for a department when its head cannot.', ''],
        ['Discrepancies', 'Deliveries › Discrepancies', 'Read-only view of differences between dispatch and receipt.', 'The Store Manager resolves them.']
      ] }
  ];

  var OVERVIEW_FEATURES = [
    ['Catalog & suppliers', 'One record per item, with the units it is bought and used in, and who supplies it.'],
    ['Purchasing & receiving', 'Plan a purchase, receive goods against it, sign the receipt and track what is owed.'],
    ['Prep', 'Turn raw items into prepared ones and see where yield drifts from the norm.'],
    ['Requisition & approval', 'Departments ask for stock; the Branch Manager reviews and signs.'],
    ['Dispatch & branch receiving', 'The store sends stock per department; the branch confirms what arrived.'],
    ['Waste & counting', 'Log waste, count blind, verify, and see the gap between the book and the shelf.']
  ];
  var FLOW = [['Buy', 'Store Manager'], ['Receive & prep', 'Attendant'], ['Requisition', 'Department Head'], ['Approve', 'Branch Manager'], ['Dispatch', 'Store team'], ['Count', 'Attendant, Store Manager']];
  var BRIEF_ALL = [
    'Each person signs their own work with a PIN, so every step has a name and a time against it.',
    'Stock is never edited directly. It changes only through a recorded action such as a receipt, dispatch or count.',
    'We are looking for what feels wrong or missing. Say so as we go and it will be written down.'
  ];
  var KINDS = [['bug', 'Bug'], ['correction', 'Correction'], ['suggestion', 'Suggestion']];

  /* ---------------- state ---------------- */
  var state = { ticks: {}, findings: [], section: 'overview', kind: 'bug', showRemoved: false };
  var db = null, writeQueue = Promise.resolve(), canWrite = true;
  var LS = 'inv-guide-v1';
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { return {}; } }
  function lsSet(o) { try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {} }
  var local = lsGet();
  state.ticks = local.ticks || {};
  state.findings = local.findings || [];

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function setSync(kind, text) { var el = document.getElementById('sync'); el.setAttribute('data-s', kind); document.getElementById('syncText').textContent = text; }
  function queue(fn) {
    writeQueue = writeQueue.then(fn).then(function () { if (canWrite) setSync('ok', 'Saved to the page'); }, function (err) {
      var code = err && err.code;
      if (code === 'invalid_argument' || code === 'not_granted') { canWrite = false; setSync('warn', 'Read only — kept on this device'); }
      else setSync('warn', 'Not saved — will retry on your next change');
    });
  }
  function saveTicks() { local.ticks = state.ticks; lsSet(local); if (db) queue(function () { return db.doc('progress/ticks').set({ done: state.ticks }); }); }
  function saveLocalFindings() { local.findings = state.findings; lsSet(local); }

  /* ---------------- helpers ---------------- */
  function roleById(id) { return ROLES.filter(function (r) { return r.id === id; })[0]; }
  function tickKey(r, i) { return r.id + '.' + i; }
  function doneCount(r) { var n = 0; r.screens.forEach(function (s, i) { if (state.ticks[tickKey(r, i)]) n++; }); return n; }
  function activeFindings() { return state.findings.filter(function (f) { return !f.removed; }); }
  function findingsFor(id) { return activeFindings().filter(function (f) { return f.role === id; }); }
  function sectionList() { return [{ id: 'overview', name: 'Overview', meta: '' }].concat(ROLES.map(function (r) { return { id: r.id, name: r.name, meta: doneCount(r) + '/' + r.screens.length }; })).concat([{ id: 'findings', name: 'All findings', meta: String(activeFindings().length) }]); }

  /* ---------------- rendering ---------------- */
  function renderNav() {
    var list = sectionList();
    document.getElementById('nav').innerHTML = '<span class="label">Sections</span>' + list.map(function (s) {
      return '<a href="#' + s.id + '" data-s="' + s.id + '"' + (s.id === state.section ? ' aria-current="page"' : '') + '><span>' + s.name + '</span><small>' + s.meta + '</small></a>';
    }).join('');
    var sel = document.getElementById('jump');
    sel.innerHTML = list.map(function (s) { return '<option value="' + s.id + '"' + (s.id === state.section ? ' selected' : '') + '>' + s.name + (s.meta ? ' · ' + s.meta : '') + '</option>'; }).join('');
    var r = roleById(state.section);
    document.getElementById('topBar').style.width = r ? (doneCount(r) / r.screens.length * 100) + '%' : '0%';
  }

  function viewOverview() {
    return '<div class="head"><div class="eyebrow">Overview</div><h1 class="title-xl">Inventory &amp; Procurement: one flow from buying to counting, across four roles</h1>' +
      '<p class="lede">The system tracks every item from the moment it is bought to the moment it is counted, so each role sees exactly its own step and the next role picks up from there.</p></div>' +
      '<div class="block"><h2>What the system does</h2><div class="rows">' + OVERVIEW_FEATURES.map(function (f) { return '<div class="row"><b>' + f[0] + '</b><span>' + f[1] + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="block"><h2>How the work flows</h2><div class="flow">' + FLOW.map(function (f, i) { return '<div><div class="line"><span class="n">' + (i + 1) + '</span>' + (i < FLOW.length - 1 ? '<i></i>' : '') + '</div><b>' + f[0] + '</b><span>' + f[1] + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="block"><h2>Before you start, tell the client</h2><div class="bullets">' + BRIEF_ALL.map(function (b) { return '<p>' + b + '</p>'; }).join('') + '</div></div>' +
      '<div class="block"><h2>Who you will take through it</h2><div class="rows">' + ROLES.map(function (r) { return '<div class="row"><b><a class="link" href="#' + r.id + '" style="font-size:15px;font-weight:600">' + r.name + '</a></b><span>' + r.screens.length + ' screens · ' + r.time + ' · ' + r.device + '</span></div>'; }).join('') + '</div></div>';
  }

  function firstOpen(r) { for (var i = 0; i < r.screens.length; i++) if (!state.ticks[tickKey(r, i)]) return i; return -1; }

  function findingsPanel(r) {
    var mine = findingsFor(r.id);
    var gone = state.findings.filter(function (f) { return f.role === r.id && f.removed; });
    return '<div class="findings" id="fp-' + r.id + '"><div class="split"><h2>Findings for ' + r.name + '</h2><span class="count">' + mine.length + ' logged</span></div>' +
      '<div class="seg" role="group" aria-label="Type of finding">' + KINDS.map(function (k) { return '<button type="button" data-kind="' + k[0] + '" aria-pressed="' + (state.kind === k[0]) + '">' + k[1] + '</button>'; }).join('') + '</div>' +
      '<div class="form"><select id="fscreen" aria-label="Screen">' + ['General'].concat(r.screens.map(function (s) { return s[0]; })).map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' +
      '<textarea id="ftext" rows="2" placeholder="What did you see, or what did they say?" aria-label="Finding"></textarea><button type="button" class="btn" id="fadd">Add</button></div>' +
      '<div class="status" id="fstatus" role="status"></div>' +
      (mine.length ? '<div class="list">' + mine.map(findingRow).join('') + '</div>' : '<div class="empty">No findings yet for this role. Type one above as it comes up.</div>') +
      (gone.length ? '<div><button type="button" class="link" id="toggleGone">' + (state.showRemoved ? 'Hide' : 'Show') + ' removed (' + gone.length + ')</button></div>' + (state.showRemoved ? '<div class="list">' + gone.map(findingRow).join('') + '</div>' : '') : '') +
      '</div>';
  }
  function findingRow(f) {
    return '<div class="item' + (f.removed ? ' gone' : '') + '"><span class="kind ' + f.type + '"><i></i>' + (f.type === 'bug' ? 'Bug' : f.type === 'correction' ? 'Correction' : 'Suggestion') + '</span><span class="scr">' + esc(f.screen) + '</span><span class="txt">' + esc(f.text) + '</span><span class="act"><button type="button" class="link" data-fid="' + f.id + '" data-act="' + (f.removed ? 'restore' : 'remove') + '">' + (f.removed ? 'Restore' : 'Remove') + '</button></span></div>';
  }

  function viewRole(r) {
    var done = doneCount(r), cur = firstOpen(r), idx = ROLES.indexOf(r);
    var prev = ROLES[idx - 1], next = ROLES[idx + 1];
    return '<div class="role-head"><div class="eyebrow">Role ' + (idx + 1) + ' of ' + ROLES.length + ' · ' + r.time + ' · ' + r.device + '</div><h1 class="title-l">' + r.name + '</h1><p class="lede">' + r.summary + '</p></div>' +
      '<div class="block"><h2>Brief the role</h2><div class="bullets">' + r.brief.map(function (b) { return '<p>' + b + '</p>'; }).join('') + '</div></div>' +
      '<div class="block"><div class="split"><h2>Screens to walk through</h2><span class="count">' + done + ' of ' + r.screens.length + ' done</span></div><div class="bar"><i style="width:' + (done / r.screens.length * 100) + '%"></i></div>' +
      '<div class="screens">' + r.screens.map(function (s, i) {
        var on = !!state.ticks[tickKey(r, i)];
        return '<label class="screen' + (on ? ' done' : '') + (i === cur ? ' current' : '') + '"><input type="checkbox" class="cb" data-tk="' + tickKey(r, i) + '"' + (on ? ' checked' : '') + '><span class="name"><b>' + s[0] + '</b><span class="path">' + s[1] + '</span></span><span class="what"><span>' + s[2] + '</span>' + (s[3] ? '<span class="point">Point out: ' + s[3] + '</span>' : '') + '</span></label>';
      }).join('') + '</div></div>' + findingsPanel(r) +
      '<div class="nav-foot">' + (prev ? '<a class="link" href="#' + prev.id + '">‹ ' + prev.name + '</a>' : '<a class="link" href="#overview">‹ Overview</a>') + (next ? '<a class="link" href="#' + next.id + '">' + next.name + ' ›</a>' : '<a class="link" href="#findings">All findings ›</a>') + '</div>';
  }

  function findingsText() {
    var out = ['Inventory walkthrough findings', ''];
    ROLES.forEach(function (r) {
      var f = findingsFor(r.id); if (!f.length) return;
      out.push(r.name); f.forEach(function (x) { out.push('- [' + x.type + '] ' + x.screen + ': ' + x.text.replace(/\s+/g, ' ')); }); out.push('');
    });
    var g = activeFindings().filter(function (f) { return !roleById(f.role); });
    if (g.length) { out.push('Other'); g.forEach(function (x) { out.push('- [' + x.type + '] ' + x.screen + ': ' + x.text); }); }
    return out.join('\n');
  }
  function viewFindings() {
    var total = activeFindings().length;
    var body = ROLES.map(function (r) {
      var f = findingsFor(r.id);
      return '<div class="block"><div class="group-h">' + r.name + ' <span class="count">· ' + f.length + '</span></div>' + (f.length ? '<div class="list">' + f.map(findingRow).join('') + '</div>' : '<div class="empty">Nothing logged.</div>') + '</div>';
    }).join('');
    return '<div class="head"><div class="eyebrow">All findings</div><h1 class="title-xl">' + total + ' finding' + (total === 1 ? '' : 's') + ' from the walkthroughs</h1><p class="lede">Everything typed in the role sections, grouped by role. Copy it into a message or ask Claude to turn it into a fix list.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn ghost" id="copyAll">Copy all findings</button><button type="button" class="btn ghost" id="dlAll">Download findings</button><span class="status" id="copyStatus" role="status"></span></div></div>' + body;
  }

  function render(keepScroll) {
    var y = window.scrollY;
    var m = document.getElementById('main');
    var r = roleById(state.section);
    m.innerHTML = state.section === 'overview' ? viewOverview() : state.section === 'findings' ? viewFindings() : viewRole(r);
    renderNav();
    if (keepScroll) window.scrollTo(0, y);
  }

  /* ---------------- events ---------------- */
  function go(id) { if (id !== state.section) { state.section = id; state.showRemoved = false; render(false); window.scrollTo(0, 0); } }
  function fromHash() { var id = (location.hash || '').replace('#', ''); if (id === 'overview' || id === 'findings' || roleById(id)) { if (id !== state.section) { state.section = id; render(false); window.scrollTo(0, 0); } } }
  window.addEventListener('hashchange', fromHash);
  document.getElementById('jump').addEventListener('change', function (e) { location.hash = e.target.value; });

  var main = document.getElementById('main');
  main.addEventListener('change', function (e) {
    var cb = e.target.closest('.cb'); if (!cb) return;
    var k = cb.getAttribute('data-tk'); if (cb.checked) state.ticks[k] = true; else delete state.ticks[k];
    saveTicks(); render(true);
  });
  main.addEventListener('click', function (e) {
    var t = e.target;
    var kind = t.closest('[data-kind]');
    if (kind) { state.kind = kind.getAttribute('data-kind'); var p = document.getElementById('ftext'), s = document.getElementById('fscreen'); var tv = p ? p.value : '', sv = s ? s.value : ''; render(true); var p2 = document.getElementById('ftext'), s2 = document.getElementById('fscreen'); if (p2) p2.value = tv; if (s2) s2.value = sv; return; }
    if (t.closest('#fadd')) return addFinding();
    var act = t.closest('[data-act]');
    if (act) return changeFinding(act.getAttribute('data-fid'), act.getAttribute('data-act'));
    if (t.closest('#toggleGone')) { state.showRemoved = !state.showRemoved; render(true); return; }
    if (t.closest('#copyAll')) return copyAll();
    if (t.closest('#dlAll')) return downloadAll();
  });

  function addFinding() {
    var ta = document.getElementById('ftext'), sc = document.getElementById('fscreen'), st = document.getElementById('fstatus');
    var text = (ta.value || '').trim();
    if (!text) { st.className = 'status err'; st.textContent = 'Type what you saw first.'; ta.focus(); return; }
    var f = { id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), role: state.section, type: state.kind, screen: sc.value, text: text, at: Date.now(), removed: false };
    state.findings.unshift(f); saveLocalFindings();
    if (db) queue(function () { return db.doc('findings/' + f.id).set(f); });
    render(true);
    var s2 = document.getElementById('fstatus'); if (s2) { s2.className = 'status'; s2.textContent = 'Added.'; }
  }
  function changeFinding(id, act) {
    var f = state.findings.filter(function (x) { return x.id === id; })[0]; if (!f) return;
    f.removed = act === 'remove'; saveLocalFindings();
    if (db) queue(function () { return db.doc('findings/' + id).set(f); });
    render(true);
  }
  function copyAll() {
    var text = findingsText(), st = document.getElementById('copyStatus');
    function fail() { st.className = 'status err'; st.textContent = 'Copy is blocked here. Select the findings below and copy them.'; }
    try { navigator.clipboard.writeText(text).then(function () { st.className = 'status'; st.textContent = 'Copied.'; }, fail); } catch (e) { fail(); }
  }

  function downloadAll() {
    var st = document.getElementById('copyStatus');
    try {
      var blob = new Blob([findingsText()], { type: 'text/plain' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'inventory-walkthrough-findings.txt'; document.body.appendChild(a); a.click(); a.remove();
      st.className = 'status'; st.textContent = 'Downloaded.';
    } catch (e) { st.className = 'status err'; st.textContent = 'Download is blocked here. Use Copy instead.'; }
  }
  /* ---------------- data ---------------- */
  render(false); fromHash();
  setSync('ok', 'Saved on this device');
})();
</script>
