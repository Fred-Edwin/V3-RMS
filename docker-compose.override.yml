# Local development override — auto-loaded by Docker Compose when present.
# Replaces the registry image references in docker-compose.yml with local builds
# so you can run `docker compose up -d` without needing IMAGE_TAG or ghcr.io access.
#
# Production server does NOT use this file (it is gitignored on the server — keep it committed
# for local dev convenience).

services:
  api:
    image: wendo-rms-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile

  worker:
    image: wendo-rms-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
